# Release of @green-on-grey/ui-kit (FTR.NAB.CMN-0005 tech §3.8):
#   push of a tag vX.Y.Z  →  checks → publishing to npm → the showcase on GitHub Pages
# Publishing is trusted (OIDC), with no token; the showcase of a version goes to /vX.Y.Z/
# of the branch gh-pages and no longer changes, and the root shows the highest version.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions: { contents: read }

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.m.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: m
        run: |
          tag=$GITHUB_REF_NAME
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$tag' is not in the format vX.Y.Z"; exit 1; }
          version=$(node -p 'require("./package.json").version')
          [[ v$version == "$tag" ]] || { echo "::error::tag $tag, while package.json has version $version"; exit 1; }
          grep -q "^## $version\b" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section '## $version'"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # A repeated run of a release does not fail on a version already published: the showcase
      # must reach Pages even when the package was published earlier.
      - name: Publish to npm
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "@green-on-grey/ui-kit@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already in the registry: publishing is skipped."
          else
            npm publish --provenance --access public
          fi

  pages:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    concurrency: { group: pages, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build:showcase
      - name: The showcase of the version to gh-pages
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash scripts/publish-pages.sh "$VERSION"
