# Проверки на каждый PR: линтер (oxlint + tsc), тесты, сборка пакета и витрины,
# поведение и снимки витрины (Playwright), журнал изменений, actionlint.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  # Ручной запуск: коммит эталонов из update-snapshots сделан GITHUB_TOKEN и сам
  # проверки не запускает — их вызывает update-snapshots.
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build:showcase
      - name: Пакет собирается и устанавливается
        run: npm pack --dry-run

  # Поведение компонентов и снимки витрины (FTR.NAB.CMN-0005 qa §1). Эталоны
  # снимков лежат в e2e/__screenshots__ и обновляются только workflow
  # update-snapshots: отрисовка на машине разработчика отличается.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # R24: изменённый снимок — видимое изменение. Оно требует записи в журнале и
  # версии не ниже следующего minor.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Видимое изменение записано в журнале и повышает minor
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/visible-change.sh "$BASE"

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
