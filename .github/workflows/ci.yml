# Checks on every PR: the linter (oxlint + tsc), tests, the build of the package and the showcase,
# behaviour and snapshots of the showcase (Playwright), the changelog, actionlint.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  # A manual run: a commit of baselines from update-snapshots is made by GITHUB_TOKEN and does not
  # start checks by itself, so update-snapshots calls them.
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build:showcase
      - name: The package builds and installs
        run: npm pack --dry-run

  # Behaviour of components and snapshots of the showcase (FTR.NAB.CMN-0005 qa §1). Baseline
  # snapshots are in e2e/__screenshots__ and change only through the workflow
  # update-snapshots: rendering on a developer's machine differs.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # R24: a changed snapshot is a visible change. It needs a changelog entry and
  # a version of at least the next minor.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: A visible change is in the changelog and raises the minor
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/visible-change.sh "$BASE"

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
