# Эталоны снимков витрины создаются и обновляются только здесь — на той же
# машине, на которой их сравнивает ci (FTR.NAB.CMN-0005 qa, решение 9). Ручной
# запуск на ветке запроса: эталоны коммитятся в неё.
name: update-snapshots
on:
  workflow_dispatch:
permissions: { contents: write }

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/visual.spec.ts --update-snapshots
      - name: Коммит эталонов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__
          if git diff --cached --quiet; then echo "Эталоны не изменились."; exit 0; fi
          git commit -m "Эталоны снимков витрины"
          git push
